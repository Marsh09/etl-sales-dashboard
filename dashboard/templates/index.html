<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sales Dashboard</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;background:#f5f6f8;color:#222}
.cards{display:flex;gap:1rem;margin-bottom:1.5rem}
.card{background:#fff;padding:1rem 1.5rem;border-radius:8px;box-shadow:0 1px 3px #0002}
.card b{display:block;font-size:1.5rem}
table{border-collapse:collapse;width:100%;background:#fff;box-shadow:0 1px 3px #0002}
th,td{padding:.6rem .9rem;text-align:left;border-bottom:1px solid #eee}
th{background:#1f3a5f;color:#fff}
</style></head><body>
<h1>Sales Dashboard</h1>
<div class="cards">
 <div class="card">Orders<b>{{ orders }}</b></div>
 <div class="card">Total revenue<b>{{ "%.2f"|format(total) }}</b></div>
</div>
<table><thead><tr>{% for c in columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
<tbody>{% for r in rows %}<tr>{% for v in r %}<td>{{ v }}</td>{% endfor %}</tr>{% endfor %}</tbody></table>
</body></html>
